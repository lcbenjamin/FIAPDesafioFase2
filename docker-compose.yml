services:
  db:
    image: mysql:8.0
    container_name: desafio_db
    environment:
      MYSQL_DATABASE: desafio_fase1
      MYSQL_USER: desafio
      MYSQL_PASSWORD: desafio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: desafio_app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/desafio_fase1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=desafio
      - SPRING_DATASOURCE_PASSWORD=desafio
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
